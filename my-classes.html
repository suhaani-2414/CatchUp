<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatchUp – My Classes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- FLOATING NOTE PAPERS -->
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  
  <!-- FLOATING BUBBLES -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="page">
    <header class="header">
      <h1 class="brand">CatchUp</h1>
    </header>

    <main class="main">
      <section class="card card--center">
        <div class="intro">
          <p class="tagline">My Classes</p>
          <p class="description">Manage the classes you're following this semester.</p>
        </div>

        <!-- Add New Class Form -->
        <form id="add-class-form" style="margin-bottom: 24px;">
          <div class="form-row">
            <input id="new-course-input" type="text" placeholder="Course code (e.g., CMSC 313)" required/>
          </div>
          <div class="form-row">
            <input id="new-professor-input" type="text" placeholder="Professor name (optional)"/>
          </div>
          <div class="form-row">
            <button type="submit" class="btn btn-primary">Add Class</button>
          </div>
        </form>

        <!-- My Classes List -->
        <div id="my-classes-list">
          <!-- Classes will be inserted here by JavaScript -->
        </div>

        <div class="quick-links" style="justify-content: center; margin-top: 20px;">
          <a href="index.html">← Back to Search</a>
          <a href="latest.html">View Latest Updates</a>
        </div>
      </section>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <script src="main.js"></script>
</body>
</html>
