<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatchUp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- FLOATING NOTE PAPERS -->
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  <div class="note-paper"></div>
  
  <!-- FLOATING BUBBLES -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="page">
    <header class="header">
      <h1 class="brand">CatchUp</h1>
    </header>

    <main class="main">
      <section class="card card--center">
        <div class="intro">
          <p class="tagline">Find out what happened in class today.</p>
          <p class="description">Student updates, Shared anonymously.</p>
        </div>
        <form id="search-form">
          <div class="form-row">
            <select id="university-select" name="university" required>
              <option value="">Select your university</option>
              <option value="university1">University of Maryland, Baltimore County</option>
            </select>
          </div>
          <div class="form-row">
            <input id="course-input" name="course" type="text" placeholder="Enter course code e.g. CMSC 313" required/>
          </div>
          <div class="form-row">
            <button type="submit">Search</button>
          </div>
        </form>
        <!---
        <div class="quick-links">
          <a href="#" id="view-classes-link">View My Classes</a>
          <a href="#" id="latest-updates-link">Latest Updates</a>
        </div>
      -->
      </section>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <script src="main.js"></script>
</body>
</html>
